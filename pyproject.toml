[project]
name = "ecommerce-ai-assistant"
version = "1.0.0"
description = "Agentic AI Shopping Assistant for Ecommerce Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis>=5.0.3",
    "pgvector>=0.2.5",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.40",
    "langchain-groq>=0.1.0",
    "groq>=0.5.0",
    "sse-starlette>=2.0.0",
    "httpx>=0.27.0",
    "pyjwt>=2.8.0",
    "structlog>=24.1.0",
    "psutil>=5.9.8"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.3.5",
    "mypy>=1.9.0"
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "SIM", "TCH", "ANN"
]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File"
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
